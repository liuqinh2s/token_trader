name: BSC Token Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore scanner state from Pages
        run: |
          mkdir -p data
          curl -fsSL --retry 2 https://liuqinh2s.github.io/token_trader/data/queue.json -o /tmp/queue.json || true
          curl -fsSL --retry 2 https://liuqinh2s.github.io/token_trader/data/scan-history.json -o /tmp/scan-history.json || true
          if node src/restore_pages_data.js /tmp/scan-history.json /tmp/queue.json; then
            echo "Restored scanner state from Pages"
          else
            echo "Pages state not available yet; migrating the last data-branch snapshot"
            git fetch --depth=1 origin data:refs/remotes/origin/data
            git checkout refs/remotes/origin/data -- data/
          fi

      - name: Run scan (GitHub Actions mode)
        run: python3 src/scan.py
        env:
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}

      - name: Build site
        run: node src/build.js
        env:
          SKIP_DATA_FETCH: '1'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: scan-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
